<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONO VIDZ TRSC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:720px;margin:28px auto;padding:18px}.logo{width:100%;display:block;margin-bottom:22px}.drop{border:5px solid #000;padding:34px 20px;text-align:center;font-size:22px;font-weight:700;cursor:pointer}.drop.drag{background:#000;color:#fff}.file{margin:12px 0;font-family:monospace}.btns{display:flex;gap:10px;margin:14px 0}.btn{flex:1;border:4px solid #000;background:#fff;color:#000;padding:14px;font-weight:900;font-size:18px;cursor:pointer}.btn:hover{background:#000;color:#fff}.btn:disabled{opacity:.4;cursor:default}.status{font-family:monospace;font-weight:700;margin:10px 0;min-height:20px}textarea{width:100%;height:320px;border:4px solid #000;padding:14px;font:16px/1.5 monospace;resize:vertical}.foot{display:flex;justify-content:space-between;font:12px monospace;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<img class="logo" src="/SONO-VIDZ-TRSC-logo.jpg" alt="SONO VIDZ TRSC">
<div id="drop" class="drop">DROP AUDIO / VIDEO</div>
<input id="pick" type="file" accept="audio/*,video/*" hidden>
<div id="filename" class="file">NO FILE</div>
<div class="btns"><button id="trsc" class="btn">TRSC</button></div>
<div id="status" class="status">READY</div>
<textarea id="text" placeholder="TRANSCRIPTION"></textarea>
<div class="btns">
<button id="copy" class="btn">COPY</button>
<button id="save" class="btn">TXT</button>
</div>
<div class="foot"><span>SONO VIDZ TRSC</span><span>LOCAL WHISPER</span></div>
</div>
<script>
const drop=document.querySelector('#drop'),pick=document.querySelector('#pick'),g=document.querySelector('#trsc'),t=document.querySelector('#text'),s=document.querySelector('#status'),fn=document.querySelector('#filename');
let file=null,audioCtx;
function tone(kind){
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const now=audioCtx.currentTime;
  if(kind==="start"){
    [440,660].forEach((freq,i)=>{const o=audioCtx.createOscillator(),gg=audioCtx.createGain();o.type="square";o.frequency.value=freq;gg.gain.setValueAtTime(.0001,now+i*.09);gg.gain.exponentialRampToValueAtTime(.12,now+i*.09+.01);gg.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.08);o.connect(gg);gg.connect(audioCtx.destination);o.start(now+i*.09);o.stop(now+i*.09+.09);});
  }else{
    [660,880,1100].forEach((freq,i)=>{const o=audioCtx.createOscillator(),gg=audioCtx.createGain();o.type="sine";o.frequency.value=freq;gg.gain.setValueAtTime(.0001,now+i*.08);gg.gain.exponentialRampToValueAtTime(.11,now+i*.08+.01);gg.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.12);o.connect(gg);gg.connect(audioCtx.destination);o.start(now+i*.08);o.stop(now+i*.08+.13);});
  }
}
function useFile(f){file=f;fn.textContent=f?f.name:"NO FILE";s.textContent=f?"READY":"NO FILE"}
drop.onclick=()=>pick.click();
pick.onchange=e=>useFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>useFile(e.dataTransfer.files[0]));
g.onclick=async()=>{
  if(!file)return;
  tone("start"); g.disabled=true; s.textContent="TRANSCRIBING...";
  const fd=new FormData(); fd.append("file",file);
  try{
    const r=await fetch("/transcribe",{method:"POST",body:fd});
    const j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||"ERROR");
    t.value=j.text; tone("done"); s.textContent="DONE · "+(j.language||"").toUpperCase();
  }catch(e){s.textContent="ERROR";t.value=e.message}
  g.disabled=false;
};
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(t.value);
document.querySelector('#save').onclick=()=>{
  if(!t.value)return;
  const original=(file&&file.name)?file.name:'TRANSCRIPTION';
  const base=original.replace(/\.[^/.]+$/,'');
  const safe=base.replace(/[\\/:*?"<>|]/g,'_');
  const u=URL.createObjectURL(new Blob([t.value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
  a.href=u;a.download=safe+'_TRSC.txt';a.click();URL.revokeObjectURL(u);
};
</script>
</body>
</html>
