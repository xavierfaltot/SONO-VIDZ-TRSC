<div class="w"><img class="logo" src="/SONO-VIDZ-TRSC-logo.jpg"><div id="drop" class="drop">DROP AUDIO / VIDEO<small>MP3 · WAV · M4A · MP4 · MOV</small></div><input id="pick" type="file" accept="audio/*,video/*" hidden><div id="fn" class="file">NO FILE</div><div class="mode"><button id="wo" class="on">WITHOUT TIME CODE</button><button id="wi">WITH TIME CODE</button></div><button id="go" class="go">TRSC</button><div id="st" class="st">● READY</div><textarea id="out" class="out"></textarea><div class="act"><button id="copy">COPY</button><button id="save">TXT</button></div><div class="foot"><span>SONO VIDZ TRSC</span><span>LOCAL WHISPER</span></div></div>
<script>let f=null,m="without";const q=x=>document.querySelector(x),out=q("#out"),st=q("#st");function sf(x){f=x;q("#fn").textContent=x?x.name:"NO FILE"}q("#drop").onclick=()=>q("#pick").click();q("#pick").onchange=e=>sf(e.target.files[0]);q("#drop").ondragover=e=>e.preventDefault();q("#drop").ondrop=e=>{e.preventDefault();sf(e.dataTransfer.files[0])};q("#wo").onclick=()=>{m="without";q("#wo").className="on";q("#wi").className=""};q("#wi").onclick=()=>{m="with";q("#wi").className="on";q("#wo").className=""};q("#go").onclick=async()=>{if(!f){st.textContent="● DROP A FILE";return}st.textContent="● TRANSCRIBING · "+(m=="with"?"WITH TIME CODE":"WITHOUT TIME CODE");let d=new FormData();d.append("file",f);d.append("timecode",m);try{let r=await fetch("/transcribe",{method:"POST",body:d}),j=await r.json();if(!r.ok)throw Error(j.error);out.value=j.text;st.textContent="● DONE · "+j.language.toUpperCase()}catch(e){st.textContent="● ERROR · "+e.message}};q("#copy").onclick=()=>navigator.clipboard.writeText(out.value);q("#save").onclick=()=>{if(!out.value)return;let b=(f?.name||"TRANSCRIPTION").replace(/\.[^/.]+$/,""),u=URL.createObjectURL(new Blob([out.value],{type:"text/plain"})),a=document.createElement("a");a.href=u;a.download=b+(m=="with"?"_TRSC_TIMECODE.txt":"_TRSC.txt");a.click();URL.revokeObjectURL(u)}</script>
